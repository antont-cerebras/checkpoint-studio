[package]
name = "checkpoint-studio"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/antont-cerebras/checkpoint-studio"
license = "MIT"
authors = ["Eric Buehler"]
description = "CLI utility to inspect and explore .safetensors, .gguf and HDF5 checkpoint files"

[workspace]
members = ["crates/core"]
resolver = "2"

# --- Lints -------------------------------------------------------------------
#
# CI runs clippy with `-D warnings`, so everything enabled here is a hard gate.
#
# `pedantic` and `nursery` are ON as groups, which turns on several hundred lints the
# codebase already satisfies — that is the point: they now catch REGRESSIONS. The
# families below are the ones with pre-existing hits; each is allowed explicitly with
# its count so the debt is visible and can be burned down one line at a time, rather
# than hidden behind a blanket `allow`.
#
# Counts were measured with `--all-targets --features hdf5`.
[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }

# Numeric casts. AUDITED (see the histogram/values fixes): every cast was triaged and
# the real defects fixed — wide-integer histogram bins, the 64-bit value display, GGUF
# sizes in f32, and two saturating-subtraction sites. What remains is provably safe:
# Ratatui geometry bounded by the terminal size, bit-shift amounts, masked 3/4-bit
# indices, pre-validated header lengths, and display/statistics maths. `u64 as usize`
# is sound because both crates assert a 64-bit target (see lib.rs / main.rs).
# `float_cmp` is deliberately NOT allowed — its existing sites carry per-function
# justifications, so a new accidental float comparison still fails the build.
cast_possible_truncation = "allow"  # 410
cast_precision_loss = "allow"  # 145
cast_possible_wrap = "allow"  # 45
cast_lossless = "allow"  # 45
cast_sign_loss = "allow"  # 42
ptr_as_ptr = "allow"  # 24
borrow_as_ptr = "allow"  # 4
# Nursery lint whose fix would retype a byte COUNT as f64 just because every use
# happens to be a ratio; keeping it an integer is the more correct type.
needless_type_cast = "allow"  # 1

# Documentation polish — worth doing, but it is prose, not correctness.
too_long_first_doc_paragraph = "allow"  # 109
missing_errors_doc = "allow"  # 57
doc_markdown = "allow"  # 54
missing_panics_doc = "allow"  # 3
doc_link_code = "allow"  # 1

# Performance/allocation nits. The best candidates to burn down next: each is a small,
# local change and a few are genuine wasted allocations.
suboptimal_flops = "allow"  # 5
redundant_clone = "allow"  # 5
needless_collect = "allow"  # 4
needless_pass_by_ref_mut = "allow"  # 4
assigning_clones = "allow"  # 3
or_fun_call = "allow"  # 2
branches_sharing_code = "allow"  # 2

# Style and API-shape opinions. Large counts, no behavioural effect; several
# (`use_self`, `must_use_candidate`, `missing_const_for_fn`) are near-mechanical if we
# ever want them.
use_self = "allow"  # 363
must_use_candidate = "allow"  # 211
missing_const_for_fn = "allow"  # 147
option_if_let_else = "allow"  # 96
map_unwrap_or = "allow"  # 73
too_many_lines = "allow"  # 58
unnested_or_patterns = "allow"  # 55
semicolon_if_nothing_returned = "allow"  # 48
redundant_closure_for_method_calls = "allow"  # 45
format_push_string = "allow"  # 37
match_same_arms = "allow"  # 33
unused_self = "allow"  # 30
items_after_statements = "allow"  # 21
needless_pass_by_value = "allow"  # 19
redundant_pub_crate = "allow"  # 14
struct_excessive_bools = "allow"  # 13
single_match_else = "allow"  # 11
unnecessary_wraps = "allow"  # 9
similar_names = "allow"  # 8
if_not_else = "allow"  # 7
manual_let_else = "allow"  # 6
return_self_not_must_use = "allow"  # 4
unreadable_literal = "allow"  # 3
bool_to_int_with_if = "allow"  # 3
match_wildcard_for_single_variants = "allow"  # 3
case_sensitive_file_extension_comparisons = "allow"  # 2
implicit_hasher = "allow"  # 2
useless_let_if_seq = "allow"  # 2
fn_params_excessive_bools = "allow"  # 2
derive_partial_eq_without_eq = "allow"  # 1
format_collect = "allow"  # 1
elidable_lifetime_names = "allow"  # 1
comparison_chain = "allow"  # 1

# Remaining measured families.
ref_option = "allow"  # 7

# --- Selected `restriction` lints (added in the strictness pass) ---------------
#
# `restriction` is not meant to be enabled as a group (it contains mutually exclusive
# opinions), so these are the individual ones worth having, each measured clean on this
# tree so they catch regressions rather than logging debt.
dbg_macro = "deny"            # a stray `dbg!` in a TUI corrupts the screen
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
print_stdout = "allow"        # this IS a CLI; stdout is the product
verbose_file_reads = "deny"
lossy_float_literal = "deny"
# NOT enabled: `rc_buffer`. The static-body cache is `Arc<Vec<u8>>` on purpose — the
# suggested `Arc<[u8]>` would mean copying every cached response body once to convert it,
# which is exactly the allocation that cache exists to avoid.
rest_pat_in_fully_bound_structs = "deny"
# A panic is a crashed TUI or a dead server, and two of the bugs fixed this week were
# exactly this class (`decode_prim`'s slice unwrap, GGUF's unbounded allocation).
#
# The audit that turned these on found 52 sites in product code and sorted them:
#   * 6 could actually fire (an empty map, a zero-column view, a truncated header, a
#     panicked worker thread) — rewritten to propagate or to bind with `let … else`.
#   * 13 are provable at the site and carry a per-site `#[allow]` with the proof.
#   * 33 are lifecycle invariants concentrated in `explorer/{mod,modes,load}.rs` — the
#     driver owns the terminal while a mode runs, `on_enter` resolves-or-leaves — and are
#     allowed at module scope with the reason. Making those structural (a state type that
#     cannot be constructed empty) is the follow-up that would delete those allows.
# Test code is exempt via `cfg_attr(test, allow(...))` at each crate root and an inner
# attribute in each integration test: an unwrap in a test IS the assertion.
unwrap_used = "deny"
expect_used = "deny"

[workspace.lints.rust]
# Compiler lints beyond the defaults, all measured clean here. Measured and left off:
# `elided_lifetimes_in_paths` — 144 sites, purely notational (`Foo` vs `Foo<'_>`), so it
# would be 144 edits of churn for no behavioural gain. (Some were tidied anyway where
# the surrounding code was already being touched.)
unused_qualifications = "warn"
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "warn"
single_use_lifetimes = "warn"
unreachable_pub = "warn"
# NOT enabled: `unsafe_code`. Two places need it and both are justified — the HDF5 LZ4
# filter registration (FFI into the bundled libhdf5) and the pty test's `openpty`/`ioctl`
# — so a blanket deny would mean a blanket allow at both, which says less than the
# per-call safety comments already there.

[dependencies]
# The frontend-free core: model + readers + views + reports. The TUI/CLI here
# drive it and render its serializable outputs.
checkpoint-studio-core = { path = "crates/core" }
safetensors = "0.4"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
crossterm = "0.28"
# `preserve_order` keeps object keys in insertion order, so the in-place tensor
# rename (`convert --map`) rewrites a safetensors header without reshuffling its
# entries (a `BTreeMap` would sort them), and index.json round-trips unchanged.
serde_json = { version = "1.0", features = ["preserve_order"] }
# The central checkpoint model + reports serialize to JSON (and other formats)
# via derive — the backbone of the "read once into one serializable datatype"
# architecture.
serde = { version = "1.0", features = ["derive"] }
glob = "0.3"
fuzzy-matcher = "0.3"
# Terminal width for output formatting (diff/progress) without pulling the full
# crossterm terminal layer into the core — a tiny, dependency-light ioctl wrapper.
terminal_size = "0.4"
# Zero-copy reads (mmap) + parallel scans for whole-tensor statistics.
memmap2 = "0.9"
rayon = "1"
# Read NumPy `.npz` archives (a ZIP of `.npy` entries). Pure-Rust: the `deflate`
# feature is backed by flate2's miniz_oxide backend, so the default build stays
# free of system dependencies. `.npy` itself needs no ZIP support.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Optional: read Cerebras-style HDF5 checkpoints. Off by default so the
# default build stays pure-Rust with no system dependencies; the `static`
# feature builds a bundled libhdf5 from source (needs a C toolchain + cmake).
hdf5-metno = { version = "0.12", optional = true, features = ["static", "zlib", "f16"] }
# Used only by the HDF5 stats reader (hyperslab streaming); version pinned to
# match hdf5-metno's so the `Array`/selection types line up.
ndarray = { version = "0.17", optional = true }
# FFI to the bundled libhdf5 (re-exports its `h5z`/`h5` symbols) so we can
# register the LZ4 decompression filter it lacks; pinned to hdf5-metno's -sys.
hdf5-metno-sys = { version = "0.11", optional = true }
# Pure-Rust LZ4 block decompression backing that filter (decode only).
lz4_flex = { version = "0.11", optional = true, default-features = false, features = ["safe-decode"] }
# `f16` reads use `half::f16` (the type hdf5-metno's `f16` feature implements
# `H5Type` for); needed to read 16-bit-float datasets without lossy conversion.
half = { version = "2", optional = true }
# Zstandard codec for the repack command (registered as an in-process HDF5
# filter, id 32015); decode-compatible with h5py + hdf5plugin's zstd.
zstd = { version = "0.13", optional = true }
colored_json = "5.0.0"
yansi = "1.0.1"
ratatui = "0.29"
unicode-width = "=0.2.0"
ansi-to-tui = "7.0.0"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
rpassword = "7.5.4"
similar = "2.7"
# `diff --map` rename rules (regex → replacement) applied to tensor names before
# the structural comparison. Also used by tests to normalize the scan duration.
regex = "1"
# `--web`: a minimal synchronous HTTP server (no async runtime / tokio, matching
# the project's blocking-IO stance) that serves the checkpoint model + reports as
# JSON and the embedded Svelte UI.
tiny_http = "0.12"
# Decode URL-encoded query values (tensor names carry `/` and `.`).
percent-encoding = "2"
# gzip the web responses (the tensor-tree JSON is tens of MB for a big
# checkpoint; gzip cuts the transfer ~10x). Pure-Rust (miniz_oxide backend).
flate2 = "1"
# Embed the built Svelte SPA (`web/dist`) into the binary so `--web` is
# self-contained. Reads from disk in debug, embeds in release.
rust-embed = "8"

# Unix only: flush the tty input buffer on exit (discard mouse-wheel reports
# still queued when quitting mid-scroll) so the shell doesn't echo them as
# garbage. crossterm already pulls libc in transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Cram-like end-to-end CLI tests: run the binary in `--plain` and snapshot the
# rendered screen. Golden files live in tests/snapshots/ and are regenerated with
# `cargo insta review` (or `INSTA_UPDATE=always cargo test`).
insta = { version = "1", features = ["filters"] }

# `tests/pty.rs` runs the TUI in a real pseudo-terminal — the only way to reach the
# interactive loop (raw mode, the alternate screen, the event read). `openpty` +
# `TIOCSWINSZ` is all that's needed, so libc rather than a pty crate.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
hdf5 = ["dep:hdf5-metno", "dep:ndarray", "dep:hdf5-metno-sys", "dep:lz4_flex", "dep:half", "dep:zstd", "checkpoint-studio-core/hdf5"]

# Diagnostic: dump dataset shape/chunk/filter layout of an HDF5 file.
[[example]]
name = "h5layout"
required-features = ["hdf5"]

# Regenerate the committed HDF5 end-to-end test fixture (tests/fixtures/tiny.hdf5).
[[example]]
name = "gen_hdf5_fixture"
required-features = ["hdf5"]

[lints]
workspace = true
