[package]
name = "checkpoint-studio"
version = "0.2.1"
edition = "2024"
repository = "https://github.com/antont-cerebras/checkpoint-studio"
license = "MIT"
authors = ["Eric Buehler"]
description = "CLI utility to inspect and explore .safetensors, .gguf and HDF5 checkpoint files"
keywords = ["safetensors", "gguf", "hdf5", "checkpoint", "tui"]
categories = ["command-line-utilities", "development-tools", "visualization"]
readme = "README.md"

[workspace]
members = ["crates/core"]
resolver = "2"

# --- Lints -------------------------------------------------------------------
#
# Everything clippy offers as a real diagnostic group is on, at `deny`, plus every rustc
# warning. CI runs `cargo clippy --workspace --all-targets` with and without
# `--all-features`, so this file is the gate.
#
# NOT enabled: `clippy::restriction`. It is not a diagnostic group — clippy's own docs say
# it "is not meant to be enabled as a whole" — and on this tree it produces 27,900 hits
# that are mostly unsatisfiable or actively wrong here:
#   * `implicit_return` (6,068) demands `return x;` on every tail expression, which
#     *contradicts* `needless_return` in `clippy::style`. The two cannot both be satisfied.
#   * `min_ident_chars` (4,218) bans `i`, `n`, `t`; `question_mark_used` (1,322) bans `?`;
#     `as_conversions` (1,252) bans `as`; `arithmetic_side_effects` (1,394) bans `+`.
#   * `non_ascii_literal` (852) bans `▀ ━ ✓ ⠋` — the glyphs this TUI is drawn with.
#   * `single_call_fn` (503) bans a helper called once, i.e. every extraction that removed
#     a copy-pasted block.
# The individually useful ones from that group are enabled by name at the bottom.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }

# --- The families that stay allowed, and why ----------------------------------
#
# Each of these was measured, triaged, and left off for a stated reason — not a count.

# Numeric casts. AUDITED: every cast was triaged and the real defects fixed — wide-integer
# histogram bins, the 64-bit value display, GGUF sizes computed in f32, two saturating
# subtractions. What remains is provably safe: Ratatui geometry bounded by the terminal
# size, bit-shift amounts, masked 3/4-bit indices, pre-validated header lengths, and
# display maths. `u64 as usize` is sound because both crates assert a 64-bit target (see
# the `usize::BITS >= 64` const assert in lib.rs / main.rs). Turning these on would mean
# ~1,000 `#[allow]`s or `try_from().unwrap_or()` chains that add a panic path each to
# silence a cast we have already shown cannot lose data.
#
# `float_cmp` is deliberately NOT here: its few sites carry per-function justifications, so
# a NEW accidental float comparison still fails the build.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_lossless = "allow"
cast_sign_loss = "allow"

# Documentation prose, not correctness: a first paragraph over one line, an undocumented
# `Err` variant on a function whose error type is a `String` message, an identifier that
# reads like code but isn't in backticks. Worth doing as writing; not worth gating a build.
too_long_first_doc_paragraph = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

# 200+ functions that *could* be `const`. Left off because it would freeze the
# implementation of functions we still change — a `const fn` cannot later call a
# non-const one without breaking every caller that relied on it in a const context.
missing_const_for_fn = "allow"

# Directly contradicts rustc's `unreachable_pub`, which is on below: inside a `pub(crate)`
# module this lint wants `pub`, and `unreachable_pub` then wants `pub(crate)` back. Only one
# can be satisfied, and `unreachable_pub` is the more useful of the two — it is what makes
# rustc's `dead_code` analysis work at all in a library crate, where a `pub` item counts as
# reachable and is therefore never reported as unused.
redundant_pub_crate = "allow"

# `if let Some(x) = o { a } else { b }` → `o.map_or_else(|| b, |x| a)`. A nursery lint whose
# suggestion clippy itself marks `MaybeIncorrect` (which is why `--fix` skips it), and the
# rewrite is a readability regression wherever the `None` branch is the longer of the two:
# `map_or_else` puts the fallback FIRST, so the common case ends up last. The 22 sites here
# are mostly `match` on an `Option` with a multi-line arm, where `match` reads better.
option_if_let_else = "allow"

# A 100-line ceiling on 7 functions that are flat, top-to-bottom report builders — the
# check runner, the diff renderer, the health reconciler, the stats formatter. They are long
# because the report has that many sections, not because they hide nested logic, and cutting
# them at an arbitrary line count would scatter one linear output across helpers that each
# have one caller.
too_many_lines = "allow"

# Two versions of `windows-sys` arrive through transitive dependencies (crossterm and
# terminal_size disagree). Nothing here can pick one, and this crate does not build for
# Windows anyway.
multiple_crate_versions = "allow"

# --- Families left allowed after this pass, with the reason for each --------------
#
# These are the ones where clippy's fix is either wrong here or a wash. Everything else the
# groups above report has been fixed; a new hit in any lint NOT listed here fails the build.

# 38 sites, and merging them would make the tables worse. Two thirds are `ui/hints.rs`'s
# help table, one arm per (screen, key) — several screens legitimately give the same help
# for the same key, and collapsing those into `(Tree | Files | Layout, Char('c'))` destroys
# the per-screen enumeration that makes a missing entry visible. The rest is `ui/theme.rs`
# mapping both a named colour and its indexed twin to one output, which is the same story.
match_same_arms = "allow"

# 15 methods that read no field. They are on `Explorer` because that is where the screens
# call them from and where they will grow to need state; making them free functions now
# would move 15 call sites and invert the grouping for no behavioural gain.
unused_self = "allow"

# 10 `const`/`use` items after the first statement in a function. Purely notational: an item
# is in scope for the whole block whatever line it sits on, and each of these sits next to
# the loop it belongs to, which is where a reader wants it.
items_after_statements = "allow"

# Taking a `Vec`/`Arc` by value where the body only reads it. Several of these are spawned
# onto a thread (the value must be owned), and the rest are one-shot builders where the
# caller has nothing left to do with the value.
needless_pass_by_value = "allow"
needless_pass_by_ref_mut = "allow"

# Structs of 4-6 independent switches, each mapping 1:1 to a CLI flag. See `DiffOpts` for
# the reasoning: the lint's real suggestion is an enum, which only helps when the options
# are mutually exclusive — and these are not.
struct_excessive_bools = "allow"
fn_params_excessive_bools = "allow"

# `&Option<T>` → `Option<&T>` on four internal signatures whose callers all hold an
# `Option<T>` field; converting at each call site adds `.as_ref()` noise to say nothing.
ref_option = "allow"

# `let hit = …` next to `let hits = …`. Renaming to satisfy a similarity heuristic makes the
# names worse, not clearer.
similar_names = "allow"

# The remaining sites are cfg pairs (`Result`/`Option` is the shared signature of a
# feature-gated pair, see `read_hdf5_shard`) and the mode driver, where the `Result` is the
# trait's return type.
unnecessary_wraps = "allow"

# This IS a CLI: stdout is the product, stderr is where progress goes.
print_stdout = "allow"
print_stderr = "allow"

# --- Individually chosen `restriction` lints ----------------------------------
#
# The ones from that group that are real diagnostics here, each measured clean so it
# catches a regression rather than logging debt.
dbg_macro = "deny"            # a stray `dbg!` in a TUI corrupts the screen
todo = "deny"
unimplemented = "deny"
mem_forget = "deny"
verbose_file_reads = "deny"
lossy_float_literal = "deny"
rest_pat_in_fully_bound_structs = "deny"
# A panic is a crashed TUI or a dead server. The audit that turned these on found 52 sites
# in product code: 6 could actually fire and were rewritten to propagate, 13 carry a
# per-site proof, and the rest were lifecycle invariants that have since been made
# structural (see `explorer/`). Test code is exempt at each crate root: an unwrap in a test
# IS the assertion.
unwrap_used = "deny"
expect_used = "deny"
# NOT enabled: `rc_buffer`. The static-body cache is `Arc<Vec<u8>>` on purpose — the
# suggested `Arc<[u8]>` would copy every cached response body once to convert it, which is
# the allocation that cache exists to avoid.

[workspace.lints.rust]
# Every rustc warning is an error. Measured: the default warn set is already clean, so this
# is a ratchet rather than a cleanup.
warnings = "deny"
# Plus the allow-by-default lints worth having, all measured clean.
unsafe_op_in_unsafe_fn = "deny"
unused_qualifications = "deny"
unused_lifetimes = "deny"
single_use_lifetimes = "deny"
unreachable_pub = "deny"
trivial_casts = "deny"
trivial_numeric_casts = "deny"
unused_import_braces = "deny"
# NOT enabled: `unsafe_code`. Two places need it and both are justified — registering the
# HDF5 LZ4 filter (FFI into the bundled libhdf5) and the pty test's `openpty`/`ioctl` — so a
# blanket deny would mean a blanket allow at both, which says less than the per-call safety
# comments already there. `elided_lifetimes_in_paths` is off too: 144 purely notational
# sites (`Foo` vs `Foo<'_>`).

[dependencies]
# The frontend-free core: model + readers + views + reports. The TUI/CLI here
# drive it and render its serializable outputs.
checkpoint-studio-core = { path = "crates/core" }
safetensors = "0.4"
clap = { version = "4.0", features = ["derive"] }
anyhow = "1.0"
crossterm = "0.28"
# `preserve_order` keeps object keys in insertion order, so the in-place tensor
# rename (`convert --map`) rewrites a safetensors header without reshuffling its
# entries (a `BTreeMap` would sort them), and index.json round-trips unchanged.
serde_json = { version = "1.0", features = ["preserve_order"] }
# The central checkpoint model + reports serialize to JSON (and other formats)
# via derive — the backbone of the "read once into one serializable datatype"
# architecture.
serde = { version = "1.0", features = ["derive"] }
glob = "0.3"
fuzzy-matcher = "0.3"
# Terminal width for output formatting (diff/progress) without pulling the full
# crossterm terminal layer into the core — a tiny, dependency-light ioctl wrapper.
terminal_size = "0.4"
# Zero-copy reads (mmap) + parallel scans for whole-tensor statistics.
memmap2 = "0.9"
rayon = "1"
# Read NumPy `.npz` archives (a ZIP of `.npy` entries). Pure-Rust: the `deflate`
# feature is backed by flate2's miniz_oxide backend, so the default build stays
# free of system dependencies. `.npy` itself needs no ZIP support.
zip = { version = "2", default-features = false, features = ["deflate"] }
# Optional: read Cerebras-style HDF5 checkpoints. Off by default so the
# default build stays pure-Rust with no system dependencies; the `static`
# feature builds a bundled libhdf5 from source (needs a C toolchain + cmake).
hdf5-metno = { version = "0.12", optional = true, features = ["static", "zlib", "f16"] }
# Used only by the HDF5 stats reader (hyperslab streaming); version pinned to
# match hdf5-metno's so the `Array`/selection types line up.
ndarray = { version = "0.17", optional = true }
# FFI to the bundled libhdf5 (re-exports its `h5z`/`h5` symbols) so we can
# register the LZ4 decompression filter it lacks; pinned to hdf5-metno's -sys.
hdf5-metno-sys = { version = "0.11", optional = true }
# Pure-Rust LZ4 block decompression backing that filter (decode only).
lz4_flex = { version = "0.11", optional = true, default-features = false, features = ["safe-decode"] }
# `f16` reads use `half::f16` (the type hdf5-metno's `f16` feature implements
# `H5Type` for); needed to read 16-bit-float datasets without lossy conversion.
half = { version = "2", optional = true }
# Zstandard codec for the repack command (registered as an in-process HDF5
# filter, id 32015); decode-compatible with h5py + hdf5plugin's zstd.
zstd = { version = "0.13", optional = true }
colored_json = "5.0.0"
yansi = "1.0.1"
ratatui = "0.29"
unicode-width = "=0.2.0"
ansi-to-tui = "7.0.0"
ssh2 = { version = "0.9.6", features = ["vendored-openssl"] }
rpassword = "7.5.4"
similar = "2.7"
# `diff --map` rename rules (regex → replacement) applied to tensor names before
# the structural comparison. Also used by tests to normalize the scan duration.
regex = "1"
# `--web`: a minimal synchronous HTTP server (no async runtime / tokio, matching
# the project's blocking-IO stance) that serves the checkpoint model + reports as
# JSON and the embedded Svelte UI.
tiny_http = "0.12"
# Decode URL-encoded query values (tensor names carry `/` and `.`).
percent-encoding = "2"
# gzip the web responses (the tensor-tree JSON is tens of MB for a big
# checkpoint; gzip cuts the transfer ~10x). Pure-Rust (miniz_oxide backend).
flate2 = "1"
# Embed the built Svelte SPA (`web/dist`) into the binary so `--web` is
# self-contained. Reads from disk in debug, embeds in release.
rust-embed = "8"

# Unix only: flush the tty input buffer on exit (discard mouse-wheel reports
# still queued when quitting mid-scroll) so the shell doesn't echo them as
# garbage. crossterm already pulls libc in transitively.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Cram-like end-to-end CLI tests: run the binary in `--plain` and snapshot the
# rendered screen. Golden files live in tests/snapshots/ and are regenerated with
# `cargo insta review` (or `INSTA_UPDATE=always cargo test`).
insta = { version = "1", features = ["filters"] }

# `tests/pty.rs` runs the TUI in a real pseudo-terminal — the only way to reach the
# interactive loop (raw mode, the alternate screen, the event read). `openpty` +
# `TIOCSWINSZ` is all that's needed, so libc rather than a pty crate.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[features]
hdf5 = ["dep:hdf5-metno", "dep:ndarray", "dep:hdf5-metno-sys", "dep:lz4_flex", "dep:half", "dep:zstd", "checkpoint-studio-core/hdf5"]

# Diagnostic: dump dataset shape/chunk/filter layout of an HDF5 file.
[[example]]
name = "h5layout"
required-features = ["hdf5"]

# Regenerate the committed HDF5 end-to-end test fixture (tests/fixtures/tiny.hdf5).
[[example]]
name = "gen_hdf5_fixture"
required-features = ["hdf5"]

[lints]
workspace = true
