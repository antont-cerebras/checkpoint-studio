# Python tooling config. There is no Python *package* here — this file exists so
# ruff and pyright have one source of truth for the Python we ship:
#
#   crates/core/src/python/*.py   the remote reader/compare scripts, embedded into
#                                 the binary with include_str! and executed on the
#                                 ssh proxy (see crates/core/src/remote.rs)
#   gen_demo.py, record_demo.py   local dev utilities for the README demo
#
# The remote scripts run under whatever interpreter the proxy's cstorch venv has,
# which we don't control — so target the oldest we're willing to support (3.9) and
# let pyupgrade rules keep us inside it, rather than suggesting 3.10+ syntax that
# would crash on an older cluster.

[tool.ruff]
target-version = "py39"
line-length = 100
extend-exclude = ["target", "web"]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes — undefined names, unused imports (the class that breaks a run)
  "W",   # pycodestyle warnings
  "B",   # flake8-bugbear — likely bugs (mutable defaults, broad raise, loop vars)
  "C4",  # comprehensions
  "SIM", # simplifications
  "UP",  # pyupgrade, bounded by target-version above
  "RET", # return-path consistency
  "PIE", # misc lints
  "ANN", # every function must be type-annotated (see ANN401 below)
  "RUF", # ruff's own
]
ignore = [
  # These are scripts, not a library: they're written in a deliberately compact style
  # (`emit(...); sys.exit(0)`) and cross an ssh boundary as a single payload. Line
  # length and one-statement-per-line would mean reformatting ~150 lines of code that
  # runs on a production cluster, for no behavioural gain.
  "E501",  # line too long
  "E701",  # multiple statements on one line (colon)
  "E702",  # multiple statements on one line (semicolon)
  # printf-style `%` formatting is used throughout and is fine — `%r` for repr in
  # error paths is the idiom here. Rewriting 41 sites in cluster code buys nothing.
  "UP031",
  # `Any` is the honest annotation for torch / numpy / boto3 / cstorch values: those
  # packages aren't importable at lint time (see reportMissingImports), so there is no
  # more precise type available. Everything else IS annotated — ANN001/ANN2xx stay on.
  "ANN401",
  # `×` in comments is intentional (matches the Rust docs' style).
  "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# The remote scripts talk to cstorch/S3 over a network on a machine we can't debug
# interactively: a broad `except Exception` that reports the failure as structured
# JSON is the intended design, not a smell.
"crates/core/src/python/*.py" = ["BLE001"]

[tool.pyright]
include = ["crates/core/src/python", "gen_demo.py", "record_demo.py"]
# Globs, and `target` matters a lot: it holds gigabytes of build artifacts and
# walking it made a project-wide run take minutes instead of seconds.
exclude = ["**/target", "**/node_modules", "web", "target"]
pythonVersion = "3.9"
typeCheckingMode = "standard"
# cerebras.pytorch only exists inside the cluster venv, and numpy/boto3 aren't
# installed in CI — so don't fail on the imports themselves. Everything else
# (undefined names, bad arity, unreachable code) is still checked.
reportMissingImports = false
reportMissingModuleSource = false

[tool.ty.rules]
# cerebras.pytorch only exists in the cluster venv; torch / numpy / boto3 / zstandard
# aren't installed in CI either. Same stance as pyright's reportMissingImports.
unresolved-import = "ignore"
