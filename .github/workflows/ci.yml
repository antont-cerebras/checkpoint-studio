name: CI

# Run on every push and pull request
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # ---------------------------------------------------------------- Rust ------
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest

    steps:
      # Check out repository code
      - name: Checkout source
        uses: actions/checkout@v4

      # Install the Rust toolchain (stable) and common components
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The `hdf5` feature statically builds a bundled libhdf5 from source,
      # which needs a C toolchain, CMake and zlib development headers.
      - name: Install HDF5 build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential zlib1g-dev

      # Cache compiled dependencies (including the built libhdf5) to speed-up
      # subsequent runs
      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2

      # Ensure the codebase is formatted according to rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Lint the default (pure-Rust) configuration that `cargo install` produces,
      # then again with all features enabled (which compiles the HDF5 support).
      - name: Lint with clippy (default features)
        run: cargo clippy --all-targets -- -D warnings

      - name: Lint with clippy (all features)
        run: cargo clippy --all-targets --all-features -- -D warnings

      # Build both configurations in release mode
      - name: Build (default features)
        run: cargo build --workspace --release --verbose

      - name: Build (all features)
        run: cargo build --workspace --release --all-features --verbose

      # Run tests (the HDF5 reader's tests require its feature)
      - name: Run tests
        env:
          # libhdf5 takes an flock() on every file it opens; CI runners' overlay
          # filesystems can return EAGAIN (errno 11) for that, failing the
          # convert/HDF5 tests. Reads don't need the lock — disable it, matching
          # the local test gate (the binary does the same at startup).
          HDF5_USE_FILE_LOCKING: "FALSE"
        run: cargo test --workspace --all-features --verbose

  # ---------------------------------------------------------------- Web -------
  # The Svelte UI is embedded into the binary from the COMMITTED `web/dist`, so it
  # can break in two ways CI previously couldn't see: a type/compile error, or a
  # `dist` that no longer matches `src` (a source change that was never rebuilt —
  # which ships a silently stale UI).
  web:
    name: Web (svelte-check, build, dist freshness)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Match `web/.nvmrc` (and the toolchain the committed dist was built with):
      # the freshness check below compares build output byte-for-byte, so the Node
      # major must be the same one developers use.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (not `install`) so the committed lockfile is authoritative.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      # Type-AWARE lint (typescript-eslint + eslint-plugin-svelte): catches what the
      # type checker won't, notably unhandled promises in the store/fetch layer.
      - name: Lint (eslint)
        run: npm run lint

      - name: Build
        run: npm run build

      # Fail if rebuilding changed anything: it means the committed `dist` was not
      # regenerated after a `src` change, so the embedded UI is stale.
      - name: Verify the committed dist is up to date
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::web/dist is stale — run 'cd web && npm ci && npm run build' and commit the result."
            exit 1
          fi

  # ---------------------------------------------------------------- Python ----
  # The remote reader/compare scripts run on the ssh proxy against S3/cstorch, so a
  # typo there fails in front of a user minutes into a job rather than at build
  # time. Lint and type-check them like first-class source.
  python:
    name: Python (ruff, pyright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 3.9 is the floor we target (see pyproject.toml): the proxy's cstorch venv
      # interpreter is not ours to choose, so check against the oldest we support
      # rather than the newest available.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Three complementary tools, all configured in pyproject.toml. They disagree
      # usefully: ty caught wrong return annotations that pyright's inference accepted,
      # and ruff enforces that the annotations exist in the first place.
      - name: Install tools
        run: pip install ruff pyright ty

      - name: Lint (ruff)
        run: ruff check .

      - name: Typecheck (pyright)
        run: pyright

      - name: Typecheck (ty)
        run: ty check crates/core/src/python gen_demo.py record_demo.py

      # Cheap syntax gate on the interpreter version we claim to support.
      - name: Byte-compile the remote scripts
        run: python -m compileall -q crates/core/src/python

      # NOTE: `ruff format --check` is deliberately not a gate yet. These scripts are
      # hand-formatted for density (they cross an ssh link as one payload) and have
      # never been through a formatter; enable it after a one-time `ruff format` pass
      # so the first run doesn't fail on pre-existing style.
