name: CI

# Run on every push and pull request
on:
  push:
    branches: [ main, master ]
  pull_request:

jobs:
  # ---------------------------------------------------------------- Rust ------
  rust:
    name: Rust (fmt, clippy, build, test)
    runs-on: ubuntu-latest

    steps:
      # Check out repository code
      - name: Checkout source
        uses: actions/checkout@v4

      # Install the Rust toolchain (stable) and common components
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # The `hdf5` feature statically builds a bundled libhdf5 from source,
      # which needs a C toolchain, CMake and zlib development headers.
      - name: Install HDF5 build prerequisites
        run: sudo apt-get update && sudo apt-get install -y cmake build-essential zlib1g-dev

      # Cache compiled dependencies (including the built libhdf5) to speed-up
      # subsequent runs
      - name: Cache cargo build outputs
        uses: Swatinem/rust-cache@v2

      # Ensure the codebase is formatted according to rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

      # Lint the default (pure-Rust) configuration that `cargo install` produces,
      # then again with all features enabled (which compiles the HDF5 support).
      #
      # `--workspace` matters: without it cargo lints only the root package, so the core
      # crate's own targets — including its ~340 tests, most of the test code in the
      # project — were never linted at all. Adding it surfaced 59 real lint errors that
      # had accumulated unseen.
      #
      # No `-- -D warnings`: a lint level on the command line OVERRIDES the `[lints]` table,
      # so passing it would defeat every documented `allow` in Cargo.toml and fail on the
      # families deliberately left off. The table sets `deny` itself — `clippy::all`,
      # `pedantic`, `nursery`, `cargo`, and rustc's `warnings` — so plain `clippy` is the
      # stricter gate here, not the looser one.
      - name: Lint with clippy (default features)
        run: cargo clippy --workspace --all-targets

      - name: Lint with clippy (all features)
        run: cargo clippy --workspace --all-targets --all-features

      # Build both configurations in release mode
      - name: Build (default features)
        run: cargo build --workspace --release --verbose

      - name: Build (all features)
        run: cargo build --workspace --release --all-features --verbose

      # Coverage with cargo-llvm-cov, which is also the test run: instrumenting once and
      # reusing the result is cheaper than testing twice, and `--fail-under-lines` is the
      # offline half of the ratchet (Codecov below compares against the parent commit).
      # Raise the floor when coverage rises; lowering it needs a reason in the commit.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Test with coverage
        env:
          HDF5_USE_FILE_LOCKING: "FALSE"
        run: |
          cargo llvm-cov --workspace --all-features --lcov --output-path lcov.info \
            --fail-under-lines 80

      - name: Upload coverage (rust)
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          flags: rust
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # Also run the suite uninstrumented: `cfg(coverage)` and the instrumented build
      # differ enough that a test can pass under one and not the other, and this is the
      # configuration users get.
      - name: Run tests
        env:
          # libhdf5 takes an flock() on every file it opens; CI runners' overlay
          # filesystems can return EAGAIN (errno 11) for that, failing the
          # convert/HDF5 tests. Reads don't need the lock — disable it, matching
          # the local test gate (the binary does the same at startup).
          HDF5_USE_FILE_LOCKING: "FALSE"
        run: cargo test --workspace --all-features --verbose

  # ---------------------------------------------------------------- Web -------
  # The Svelte UI is embedded into the binary from the COMMITTED `web/dist`, so it
  # can break in two ways CI previously couldn't see: a type/compile error, or a
  # `dist` that no longer matches `src` (a source change that was never rebuilt —
  # which ships a silently stale UI).
  web:
    name: Web (svelte-check, build, dist freshness)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # Match `web/.nvmrc` (and the toolchain the committed dist was built with):
      # the freshness check below compares build output byte-for-byte, so the Node
      # major must be the same one developers use.
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # `npm ci` (not `install`) so the committed lockfile is authoritative.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck (svelte-check)
        run: npm run check

      # Type-AWARE lint (typescript-eslint + eslint-plugin-svelte): catches what the
      # type checker won't, notably unhandled promises in the store/fetch layer.
      - name: Lint (eslint)
        run: npm run lint

      # The unit tests over `src/lib` — including `parity.test.ts`, the TypeScript half
      # of the TUI↔web display contract in shared/parity (the Rust half runs in the
      # rust job's `cargo test`). Without this step that contract only ever held on
      # one side.
      # `npm run coverage` is `npm test` plus instrumentation: the thresholds in
      # vitest.config.ts fail the run if coverage drops, and the lcov goes to Codecov.
      - name: Test with coverage (vitest)
        run: npm run coverage

      - name: Upload coverage (web)
        uses: codecov/codecov-action@v4
        with:
          files: web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false
          working-directory: ${{ github.workspace }}
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Build
        run: npm run build

      # Fail if rebuilding changed anything: it means the committed `dist` was not
      # regenerated after a `src` change, so the embedded UI is stale.
      - name: Verify the committed dist is up to date
        run: |
          if ! git diff --exit-code --stat -- dist; then
            echo "::error::web/dist is stale — run 'cd web && npm ci && npm run build' and commit the result."
            exit 1
          fi

  # ------------------------------------------------------- Duplication --------
  # Copy-paste detection over the Rust sources (jscpd, token-based). A gate rather than a
  # report: `threshold` in `.jscpd.json` is the current number, so duplication cannot grow
  # without someone deciding to raise it — the same ratchet the coverage floor uses.
  #
  # Its own job because it needs Node and the Rust job does not; it takes seconds and runs in
  # parallel with everything else.
  duplication:
    name: Duplication (jscpd)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc

      # Pinned EXACTLY, for two reasons: jscpd's percentage moves between versions (its
      # tokenizer changes), and a gate that drifts on its own is not a gate — and `jscpd@4`
      # pulls `commander@15`, which requires Node >= 22.12 and so cannot install on the Node
      # this repo pins. The threshold in `.jscpd.json` was measured with this version.
      - name: Check for duplicated code
        run: npx --yes jscpd@5.0.12 --config .jscpd.json

  # ---------------------------------------------------------------- Python ----
  # The remote reader/compare scripts run on the ssh proxy against S3/cstorch, so a
  # typo there fails in front of a user minutes into a job rather than at build
  # time. Lint and type-check them like first-class source.
  python:
    name: Python (ruff, pyright, tests)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # 3.9 is the floor we target (see pyproject.toml): the proxy's cstorch venv
      # interpreter is not ours to choose, so check against the oldest we support
      # rather than the newest available.
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      # Three complementary tools, all configured in pyproject.toml (except pyright, which
      # reads pyrightconfig.json). They disagree usefully: ty caught wrong return
      # annotations that pyright's inference accepted, and ruff enforces that the
      # annotations exist in the first place.
      - name: Install tools
        # `coverage[toml]` because the config lives in pyproject.toml and 3.9 has no
        # tomllib.
        #
        # numpy is here as a TYPE-CHECKING dependency, not a runtime one: the remote
        # scripts import it, and unlike torch/cstorch/boto3 (hand-stubbed in `typings/`,
        # see typings/README.md) numpy is small and ships precise inline types, so it is
        # installed rather than stubbed. `<2` matches the 1.x line the proxy's cstorch
        # venv is built on, so we check against the types the scripts actually meet.
        run: pip install ruff pyright ty "numpy<2" "coverage[toml]"

      - name: Lint (ruff)
        run: ruff check .

      # Both type checkers run in STRICT mode over the remote scripts, which is only
      # meaningful because `typings/` makes their third-party imports resolve — before
      # that, every cluster-side value was `Unknown` and neither tool checked the code
      # that matters most (it runs on a cluster we cannot debug interactively).
      - name: Typecheck (pyright, strict)
        run: pyright

      - name: Typecheck (ty)
        run: ty check crates/core/src/python crates/core/tests/python gen_demo.py record_demo.py

      # Cheap syntax gate on the interpreter version we claim to support.
      - name: Byte-compile the remote scripts
        run: python -m compileall -q crates/core/src/python

      # Run the scripts themselves, against stubbed cstorch/boto3: the protocol they
      # print, the progress phases, the parallel S3 metadata pass, pagination and the
      # error paths. Needs no cluster and no torch — see the module docstring for what
      # is deliberately left to the recorded-transcript replay tests instead.
      - name: Test the remote scripts with coverage
        run: |
          python -m coverage run -m unittest discover \
            -s crates/core/tests/python -t crates/core/tests/python
          python -m coverage report        # honours fail_under from pyproject.toml
          python -m coverage xml

      - name: Upload coverage (python)
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: python
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      # NOTE: `ruff format --check` is deliberately not a gate yet. These scripts are
      # hand-formatted for density (they cross an ssh link as one payload) and have
      # never been through a formatter; enable it after a one-time `ruff format` pass
      # so the first run doesn't fail on pre-existing style.
